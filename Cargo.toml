description = "Ternary decision compiler: converts {-1, 0, +1} decisions into bytecode for coordination"
license = "MIT"
repository = "https://github.com/SuperInstance/ternary-compiler"
keywords = ["ternary", "compiler", "bytecode", "vm"]
categories = ["compilers"]

[dependencies]
serde = { version = "1", features = ["derive"] }

